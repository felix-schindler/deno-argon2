[package]
name = "deno-argon2"
version = "3.1.0"
authors = ["Felix <webmaster@schindlerfelix.de>", "Federico <code@fdionisi.me>"]
edition = "2018"

[lib]
path = "native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
argon2 = "0.6.0"
bytes = { version = "1.12.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
